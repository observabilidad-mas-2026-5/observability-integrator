receivers:
  otlp:
    protocols:
      grpc: {endpoint: "0.0.0.0:4317"}
      http: {endpoint: "0.0.0.0:4318"}
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  resource:
    attributes:
      - {key: lab.name, value: credit-lab, action: upsert}
  batch: {timeout: 1s, send_batch_size: 1024}
exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: {insecure: true}
  prometheus:
    endpoint: "0.0.0.0:8889"
    resource_to_telemetry_conversion: {enabled: true}
    enable_open_metrics: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
extensions:
  health_check: {endpoint: "0.0.0.0:13133"}
service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus: {host: "0.0.0.0", port: 8888}
  pipelines:
    traces: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlp/jaeger]}
    metrics: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [prometheus]}
    logs: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlphttp/loki]}

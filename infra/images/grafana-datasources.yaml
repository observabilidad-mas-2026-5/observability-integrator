apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://127.0.0.1:9090
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations:
        - {name: trace_id, datasourceUid: jaeger}
  - name: Jaeger
    uid: jaeger
    type: jaeger
    url: http://127.0.0.1:16686/jaeger
    jsonData:
      nodeGraph: {enabled: true}
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        customQuery: true
        query: '{service_name=~"service-a.*|service-b.*"} | trace_id="$${__span.traceId}"'
  - name: Loki
    uid: loki
    type: loki
    url: http://127.0.0.1:3100
    jsonData:
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: jaeger
          url: '$${__value.raw}'

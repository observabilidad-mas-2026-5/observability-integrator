
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48

  resource:
    attributes:
      - key: lab.name
        value: observability-integrator
        action: upsert
      - key: deployment.environment
        value: aws-lab
        action: upsert
      - key: cloud.region
        value: ${env:AWS_REGION}
        action: upsert

  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 512

extensions:
  health_check:
    endpoint: "0.0.0.0:13133"

  sigv4auth/traces:
    region: ${env:AWS_REGION}
    service: xray

  sigv4auth/metrics:
    region: ${env:AWS_REGION}
    service: monitoring

  sigv4auth/logs:
    region: ${env:AWS_REGION}
    service: logs

exporters:
  otlphttp/traces:
    endpoint: https://xray.${env:AWS_REGION}.amazonaws.com
    auth:
      authenticator: sigv4auth/traces

  otlphttp/metrics:
    endpoint: https://monitoring.${env:AWS_REGION}.amazonaws.com
    auth:
      authenticator: sigv4auth/metrics

  otlphttp/logs:
    endpoint: https://logs.${env:AWS_REGION}.amazonaws.com
    headers:
      x-aws-log-group: ${env:OTEL_LOG_GROUP}
      x-aws-log-stream: ${env:OTEL_LOG_STREAM}
    auth:
      authenticator: sigv4auth/logs

service:
  extensions:
    - health_check
    - sigv4auth/traces
    - sigv4auth/metrics
    - sigv4auth/logs

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/traces]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/metrics]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/logs]
